title: AI Coding Agent Spawns Process Touching Credential Files
id: 3e8f1a2b-7c6d-4e9f-a0b1-c2d3e4f5a644
status: experimental
description: |
  Detects shells or utilities launched by an AI coding agent or MCP server process whose command line
  references credential material (SSH keys, cloud credentials, .env files). A common outcome of
  indirect prompt injection or MCP tool poisoning against developer agents.
references:
  - https://github.com/Nexqor/ai-attack-playbook/blob/main/02-indirect-prompt-injection.md
  - https://github.com/Nexqor/ai-attack-playbook/blob/main/09-mcp-tool-poisoning.md
author: Nexqor
date: 2026-11-21
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.t1552.004
logsource:
  category: process_creation
detection:
  selection_parent:
    ParentCommandLine|contains:
      - 'claude'
      - 'cursor'
      - 'copilot'
      - 'gemini'
      - 'codex'
      - 'windsurf'
      - 'mcp-server'
      - 'modelcontextprotocol'
  selection_secret:
    CommandLine|contains:
      - 'id_rsa'
      - 'id_ed25519'
      - '.aws/credentials'
      - '.aws\credentials'
      - '.git-credentials'
      - '.npmrc'
      - '.pypirc'
      - '.env'
      - '.kube/config'
      - 'claude_desktop_config.json'
  condition: selection_parent and selection_secret
falsepositives:
  - Developers explicitly asking an agent to work with config or env files (review the prompt that triggered it)
level: high
